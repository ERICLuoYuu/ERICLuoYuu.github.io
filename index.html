<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A parcel for you</title>
  <meta name="description" content="A small hand-made parcel. Cut the tape and see what is inside.">
  <meta name="theme-color" content="#e9dcc3">
  <link rel="icon" href="assets/ui/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/caveat-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/noto-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/noto-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/book.css">
  <script src="vendor/page-flip/page-flip.browser.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body data-state="loading">
  <div class="loader" id="loader" role="status" aria-live="polite">
    <svg class="loader-parcel" viewBox="0 0 120 100" aria-hidden="true">
      <path d="M14 38 L60 18 L106 38 L60 58 Z" fill="#d9b483" stroke="#4a3426" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M14 38 L14 78 L60 96 L60 58 Z" fill="#c99c67" stroke="#4a3426" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M106 38 L106 78 L60 96 L60 58 Z" fill="#b78a56" stroke="#4a3426" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M37 28 L83 48" stroke="#fff6e2" stroke-width="7" opacity=".7" stroke-linecap="round"/>
    </svg>
    <p class="loader-text hand" id="loader-text">unpacking…</p>
    <div class="loader-track" aria-hidden="true"><span id="loader-progress"></span></div>
  </div>

  <p class="fatal" id="fatal" role="alert" hidden></p>

  <main class="experience" id="experience">
    <div class="stage" id="stage">
      <div class="clothes-controls" id="clothes-controls"></div>
      <div class="camera" id="camera"></div>
      <canvas class="clothes-layer" id="clothes" aria-hidden="true"></canvas>
    </div>
    <p class="instruction hand" id="instruction"></p>
    <p class="clothes-hint hand" id="clothes-hint" hidden></p>
    <div class="cut-slider" id="cut-slider" role="slider" tabindex="0"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0% of the tape cut">
      <span class="hand" id="slider-text">Hold → to cut the tape</span>
    </div>
    <img class="knife-marker" id="knife-marker" src="assets/ui/knife.svg" alt="" hidden>
  </main>

  <section class="reader" id="reader" tabindex="-1" aria-label="Introduction book" hidden>
    <div class="reader-book" id="reader-book"></div>
    <button class="reader-btn reader-close" id="reader-close" type="button" aria-label="Close the book">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 6 C9 9.5 14 14.6 18.4 18.2 M18 5.6 C14.2 9.4 9.6 14.2 6 18.4"/></svg>
    </button>
    <button class="reader-btn reader-prev" id="reader-prev" type="button" aria-label="Previous page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5 C12 8.5 9.5 10.6 7.6 12.2 C10 14 12.4 16.2 15.2 19.2"/></svg>
    </button>
    <button class="reader-btn reader-next" id="reader-next" type="button" aria-label="Next page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5 C12 8.5 14.5 10.6 16.4 12.2 C14 14 11.6 16.2 8.8 19.2"/></svg>
    </button>
    <p class="reader-indicator hand" id="reader-indicator" role="status">
      <span class="indicator-visual" id="indicator-visual" aria-hidden="true"></span>
      <span class="sr-only" id="indicator-spoken"></span>
    </p>
    <p class="reader-hint hand" id="reader-hint"></p>
  </section>

  <div class="flyer" id="flyer" aria-hidden="true" hidden></div>
  <div class="measure" id="measure" aria-hidden="true"></div>

  <nav class="controls" aria-label="Sound and restart">
    <button class="control" id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="speaker" d="M4.2 9.4 L7.6 9.2 L12 5.4 C12.4 9.6 12.4 14.6 12 18.6 L7.6 14.8 L4.2 14.6 Z"/>
        <path class="waves" d="M15.2 9 C16.4 10.4 16.4 13.6 15.2 15 M17.6 6.6 C20 9.2 20 14.8 17.6 17.4"/>
        <path class="cross" d="M15.4 9.4 L20.2 14.6 M20.2 9.4 L15.4 14.6"/>
      </svg>
    </button>
    <button class="control" id="restart" type="button" aria-label="Start again with a sealed parcel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.6 13.2 C18.2 17 15.2 19.6 11.6 19.4 C7.8 19.2 5 16 5.2 12.2 C5.4 8.4 8.6 5.4 12.4 5.6 C14.6 5.7 16.4 6.8 17.6 8.4"/>
        <path d="M18.2 4.4 L17.8 8.8 L13.6 8.2"/>
      </svg>
    </button>
  </nav>

  <div class="sr-only" id="announcer" aria-live="polite"></div>

  <noscript>
    <p class="fatal">This little parcel needs JavaScript to open. Please enable it and reload.</p>
  </noscript>
</body>
</html>
